ifndef GNU_TOOLS_DIR 
#GNU_TOOLS_DIR = `psp-config -P`
GNU_TOOLS_DIR = $(VITASDK)/arm-vita-eabi
endif

export ENABLE_C_INTERPRETER             := true
export ENABLE_C_INTERPRETER__BY         := javacall_vita_gcc.cfg
export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := javacall_vita_gcc.cfg
export ENABLE_COMPILER                  := false
export ENABLE_COMPILER__BY              := javacall_vita_gcc.cfg

# Host tools (loopgen/romgen) are built and executed on Linux.
# Keep the host CPU tagged as i386 for this old CLDC build system; the
# generators use the C interpreter, so no x86 machine-code backend is needed.
host_os   = linux
host_arch = i386
os_family = linux
compiler  = gcc
arch      = c

# javacall_vita_gcc is built with GCC/Unix path and object conventions.
# Using WinGammaPlatform here creates .obj dependencies and backslash paths
# such as incls\_precompiled.incl, which are invalid for the Linux build host.
MakeDepsMain_javacall = UnixPlatform
MakeDepsOpts_javacall = -resolveVpath true

# phoneME's loopgen/romgen host code assumes a 32-bit address space in
# several ROM data structures.  Build only the HOST generators as i386;
# the final target is still compiled with arm-vita-eabi-gcc.
ifneq ($(IsTarget),true)
    CPP_DEF_FLAGS += -m32
    ASM_FLAGS     += --32
    LINK_FLAGS    += -m32
endif

# RomGen runs on the Linux host but emits a ROM image for a 32-bit ARM
# target.  These settings mirror the upstream linux_arm cross-generator.
ifeq ($(IsRomGen),true)
    os_family = linux
    arch      = c
    compiler  = gcc

    # Host-only tool: use shared glibc/libm on Ubuntu/WSL.  Noble's static
    # i386 libm may not export fmod/fmodf, which phoneME RomGen requires.
    DISABLE_STATIC_ROMGEN := true

    # Legacy ARM sources trigger harmless precedence warnings on modern GCC.
    # In phoneME jvm.make, setting this true prevents those warnings from
    # being promoted to errors with -Werror.  RomGen still prints warnings.
    override ENABLE_COMPILATION_WARNINGS := true

    export ENABLE_C_INTERPRETER             := true
    export ENABLE_C_INTERPRETER__BY         := javacall_vita_gcc.cfg
    export ENABLE_INTERPRETER_GENERATOR     := false
    export ENABLE_INTERPRETER_GENERATOR__BY := javacall_vita_gcc.cfg

    export TARGET_MSW_FIRST_FOR_DOUBLE      := true
    export TARGET_MSW_FIRST_FOR_DOUBLE__BY  := javacall_vita_gcc.cfg
    export TARGET_MSW_FIRST_FOR_LONG        := false
    export TARGET_MSW_FIRST_FOR_LONG__BY    := javacall_vita_gcc.cfg

    # C-interpreter RomGen is a normal host Linux/i386 program.
    # Do NOT define ARM/CROSS_GENERATOR here: the upstream generic ARM C
    # interpreter also romizes with the host architecture and emits the
    # machine-independent ROM image.
endif

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES  = true
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE  = 35
endif

INVALID_JAVACALL_OUTPUT_DIR = (\
echo ===================================================================== ; \
echo JAVACALL_OUTPUT_DIR \(environment or GNUmake variable\) must be set.  ; \
echo Please set it such that it is possible to access                      ; \
echo \$${JAVACALL_OUTPUT_DIR}/inc and \$${JAVACALL_OUTPUT_DIR}/lib         ; \
echo directories.                                                          ; \
echo ===================================================================== )

ifeq ($(JAVACALL_OUTPUT_DIR),)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error JAVACALL_OUTPUT_DIR is not set)
endif
ifneq ($(shell if test -d $(JAVACALL_OUTPUT_DIR); then echo valid; fi),valid)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error $${JAVACALL_OUTPUT_DIR} does not point to a directory)
endif
ifneq ($(shell if test -d $(JAVACALL_OUTPUT_DIR)/inc; then echo valid; fi),valid)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error $${JAVACALL_OUTPUT_DIR/inc} is not a directory)
endif
ifneq ($(shell if test -d $(JAVACALL_OUTPUT_DIR)/lib; then echo valid; fi),valid)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error $${JAVACALL_OUTPUT_DIR/lib} is not a directory)
endif

ifneq ($(findstring CYGWIN, $(shell uname)), CYGWIN)
    define fixcygpath_m
    echo $(1)
    endef
else
    define fixcygpath_m
    echo $(1) | xargs -n1 cygpath -m
    endef
endif

LOOP_GEN_FLAGS = +GenerateGNUCode +AddExternCUnderscore
ROM_GEN_FLAGS  = +GenerateGNUCode

ifeq ($(IsTarget),true)
# VitaSDK GCC is configured to emit Thumb code by default.  Tell phoneME
# the VM C code is Thumb as well, otherwise GlobalDefinitions_gcc.hpp uses
# the ARM-only 24-bit semihosting SWI (swi 0x9f0001), which cannot be
# assembled in Thumb mode.  Java bytecode JIT remains disabled.
export ENABLE_THUMB_VM                := true
export ENABLE_THUMB_VM__BY            := javacall_vita_gcc.cfg
THUMB_CFLAGS                          += -mthumb
# phoneME uses the removed C++17 register keyword extensively.
# Keep it as a warning on the Vita target instead of failing under -Werror.
USER_CFLAGS                           += -Wno-error=register
# ROMImage.cpp is generated by old phoneME as signed jint arrays but emits
# 32-bit hex constants above INT_MAX. GCC 15/C++17 diagnoses those list
# initializers as narrowing; preserve the intended 32-bit bit patterns.
USER_CFLAGS                           += -Wno-narrowing
# GCC 15 emits aggressive flow-analysis warnings in optimized/release builds
# for phoneME's old TRAPS/CHECK control-flow macros and static bootstrap code.
# They are warnings, not target ABI errors; do not promote them to fatal errors.
USER_CFLAGS                           += -Wno-error=maybe-uninitialized
USER_CFLAGS                           += -Wno-error=uninitialized

export ENABLE_PCSL = true
export ENABLE_PCSL := true
    os_family = javacall
    arch = c
    target_arch = arm

#MERGE_SOURCE_FILES  = false

export ENABLE_TIMER_THREAD     = false
export ENABLE_TIMER_THREAD__BY = javacall_vita_gcc.cfg

export ENABLE_PRODUCT_PRINT_STACK = true
export ENABLE_PRODUCT_PRINT_STACK__BY = javacall_vita_gcc.cfg

    export skip_link_image := true
    
    JAVACALL_INCLUDE_DIR=$(JAVACALL_OUTPUT_DIR)/inc
    JAVACALL_LIB_DIR=$(JAVACALL_OUTPUT_DIR)/lib

    CPP_DEF_FLAGS += -I$(JAVACALL_INCLUDE_DIR) -DARM -D__vita__
    #LINK_FLAGS += `$(call fixcygpath_m, $(JAVACALL_LIB_DIR)/libjavacall$(BUILD_EXT_javacall).a)` 
endif
